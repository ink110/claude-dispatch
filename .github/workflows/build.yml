name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Build universal app
        run: ./scripts/build.sh

      - name: Verify architectures
        run: lipo -info build/ClaudeDispatch.app/Contents/MacOS/ClaudeDispatch

      - name: Run humanizer tests
        run: ./scripts/test-humanizer.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeDispatch-app
          path: build/ClaudeDispatch.app
          if-no-files-found: error
